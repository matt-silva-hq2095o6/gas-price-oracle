[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gas-price-oracle"
version = "0.3.0"
description = "Local fee estimation daemon and CLI for EVM chains"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.25.0",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
gas-oracle = "gas_price_oracle.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gas_price_oracle*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
